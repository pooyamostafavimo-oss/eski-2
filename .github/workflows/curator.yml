name: News Curator Bot

on:
  schedule:
    # Hourly during the day (UTC 03:00-21:00 ≈ Tehran 06:30-00:30)
    - cron: "0 3-21 * * *"
    # Every 2h during Tehran's quiet hours (UTC 22,0,2 ≈ Tehran ~01:30-05:30),
    # when there's usually little news worth the extra Gemini quota
    - cron: "0 22,0,2 * * *"
  workflow_dispatch: {}

# Prevent overlapping runs from racing on last_ids.json
concurrency:
  group: news-curator-bot
  cancel-in-progress: false

permissions:
  contents: write  # needed so the "Commit updated state" step can push

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run curator bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          # Optional - all have sensible defaults if the secret isn't set.
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RUN_TIMEOUT_SECONDS: ${{ secrets.RUN_TIMEOUT_SECONDS }}
          CHANNEL_FAIL_ALERT_THRESHOLD: ${{ secrets.CHANNEL_FAIL_ALERT_THRESHOLD }}
          STATS_INTERVAL_SECONDS: ${{ secrets.STATS_INTERVAL_SECONDS }}
        run: python curator_bot.py

      - name: Commit updated state
        run: |
          git config user.name "news-curator-bot"
          git config user.email "actions@github.com"
          git add last_ids.json
          git diff --staged --quiet || git commit -m "Update last_ids.json [skip ci]"
          git push
